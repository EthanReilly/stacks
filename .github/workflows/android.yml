name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Load the signing key
        env:
          STACKS_SIGNING: ${{ secrets.STACKS_SIGNING }}
        run: |
          if [ -z "$STACKS_SIGNING" ]; then
            echo "::error title=Signing key missing::Add the STACKS_SIGNING secret in Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi
          pw="${STACKS_SIGNING%%:*}"
          echo "::add-mask::$pw"
          printf '%s' "${STACKS_SIGNING#*:}" | base64 -d > "$RUNNER_TEMP/stacks.jks"
          {
            echo "STACKS_KEYSTORE_PATH=$RUNNER_TEMP/stacks.jks"
            echo "STACKS_KEYSTORE_PASSWORD=$pw"
            echo "STACKS_KEY_PASSWORD=$pw"
            echo "STACKS_KEY_ALIAS=stacks"
          } >> "$GITHUB_ENV"

      - name: Set the version
        run: echo "APP_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build the app page
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build and sign the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName="$APP_VERSION" --no-daemon --stacktrace

      - name: Check the signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          cp "$APK" stacks.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stacks-${{ env.APP_VERSION }}
          path: stacks.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$APP_VERSION"
          NOTES="$(git log -1 --pretty=%s)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" stacks.apk --clobber
          else
            gh release create "$TAG" stacks.apk --title "Stacks $APP_VERSION" --notes "$NOTES" --latest
          fi
