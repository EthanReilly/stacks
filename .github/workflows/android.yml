name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Load the signing key
        env:
          STACKS_SIGNING: ${{ secrets.STACKS_SIGNING }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          fail() { echo "::error title=Signing key::$1"; exit 1; }
          [ -n "$STACKS_SIGNING" ] || fail "The STACKS_SIGNING secret is missing. Add it in Settings > Secrets and variables > Actions."
          # tolerate spaces or line breaks picked up while pasting
          raw="$(printf '%s' "$STACKS_SIGNING" | tr -d ' \r\n\t')"
          pw="${raw%%:*}"; b64="${raw#*:}"
          [ "$pw" != "$raw" ] || fail "The secret should be one line: password, a colon, then the key. Paste the whole STACKS_SIGNING.txt file."
          echo "::add-mask::$pw"
          printf '%s' "$b64" | base64 -d > "$RUNNER_TEMP/stacks.jks" 2>/dev/null || fail "The key part of the secret isn't valid. Paste the whole STACKS_SIGNING.txt file again."
          keytool -list -keystore "$RUNNER_TEMP/stacks.jks" -storepass "$pw" -alias stacks >/dev/null 2>&1 || fail "The key doesn't open with its password. Paste the whole STACKS_SIGNING.txt file again."
          echo "Signing key OK ($(wc -c < "$RUNNER_TEMP/stacks.jks") bytes)"
          {
            echo "STACKS_KEYSTORE_PATH=$RUNNER_TEMP/stacks.jks"
            echo "STACKS_KEYSTORE_PASSWORD=$pw"
            echo "STACKS_KEY_PASSWORD=$pw"
            echo "STACKS_KEY_ALIAS=stacks"
          } >> "$GITHUB_ENV"

      - name: Set the version
        run: echo "APP_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build the app page
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          npm ci
          npm run build
          npx cap sync android

      - name: Build and sign the APK
        working-directory: android
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName="$APP_VERSION" --no-daemon --stacktrace

      - name: Check the signature
        run: |
          OUT=android/app/build/outputs/apk/release
          FILES=$(ls "$OUT" 2>&1 | tr '\n' ' ')
          APK=$(ls "$OUT"/*.apk 2>/dev/null | head -1)
          [ -n "$APK" ] || { echo "::error title=No APK::Nothing in $OUT: $FILES"; exit 1; }
          case "$APK" in *unsigned*) echo "::error title=APK not signed::Gradle built $FILES without the signing key"; exit 1;; esac
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          CERT=$("$BT/apksigner" verify --print-certs "$APK" 2>&1) || { echo "::error title=Signature check failed::$(echo "$CERT" | head -3 | tr '\n' ' ')"; exit 1; }
          echo "$CERT" | head -3
          echo "::notice title=Signed::$(echo "$CERT" | grep -m1 SHA-256)"
          cp "$APK" stacks.apk

      - name: Report the error
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/build.log" ] || exit 0
          tail -n 60 "$RUNNER_TEMP/build.log" | grep -v "^\s*$" | tail -n 40 > "$RUNNER_TEMP/tail.txt"
          msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$RUNNER_TEMP/tail.txt" | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=Build log (last lines)::$msg"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$APP_VERSION"
          NOTES="$(git log -1 --pretty=%s)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" stacks.apk --clobber
          else
            gh release create "$TAG" stacks.apk --title "Stacks $APP_VERSION" --notes "$NOTES" --latest
          fi
