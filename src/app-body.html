    }
    app.innerHTML = `<header class="today-head"><div><span class="eyebrow">${esc(dateLine)}</span><h1>${greet}</h1></div>
      <button class="icon-btn" type="button" data-action="settings" aria-label="Settings: backup, restore${NATIVE ? ', notifications, updates' : ''}">${ICON.gear}</button></header>${todayNudges()}${body}`;
  }
  /* Cards at the top of Today: an app update, or a backup that's overdue (the app keeps data only on the phone). */
  function todayNudges() {
    let out = '';
    if (NATIVE && state.update) out += `<div class="nudge">${ICON.download}<span class="nudge-text"><strong>Update available: version ${esc(state.update.version)}</strong><span>Download it and open the file to update. Your data stays.</span></span><button class="btn primary" type="button" data-action="app-update">Download</button></div>`;
    if (NATIVE && state.synced && !state.readOnly) {
      const has = allNotes().length + Object.keys(state.reminders).length + Object.keys(state.secrets).length;
      const p = state.prefs || {}, last = p.lastBackup || 0, snooze = p.backupSnooze || 0, now = Date.now();
      if (has >= 3 && now - last > 30 * 86400000 && now - snooze > 7 * 86400000)
        out += `<div class="nudge">${ICON.download}<span class="nudge-text"><strong>${last ? 'Your last backup was ' + esc(fmtDate(last)) : 'Back up your data'}</strong><span>Everything is stored on this phone only. Keep a copy in Google Drive or Files.</span></span>
          <span class="nudge-actions"><button class="btn primary" type="button" data-action="backup-now">Back up</button><button class="btn" type="button" data-action="backup-snooze">Not now</button></span></div>`;
    }
    return out;
  }

  function openReminderSheet(r, presetDate) {
    if (state.readOnly) return;
    const editing = !!r;
    openSheet(`<h2 id="sheet-title">${editing ? 'Edit reminder' : 'New reminder'}</h2>
      <div class="field"><label for="rem-title">Remind me to</label><input class="input" id="rem-title" maxlength="200" placeholder="e.g. Renew car tax" autocomplete="off"></div>
      <div class="field"><span>When</span>
        <div class="quick">
          <button class="chip" type="button" data-quick="0">Today</button>
          <button class="chip" type="button" data-quick="1">Tomorrow</button>
          <button class="chip" type="button" data-quick="7">Next week</button>
          <button class="chip" type="button" data-quick="none">No date</button>
        </div>
        <div class="dt"><input class="input" type="date" id="rem-date" aria-label="Date"><input class="input" type="time" id="rem-time" aria-label="Time (optional)"></div>
        <span class="hint">Time is optional.</span>
      </div>
      <div class="field"><label for="rem-repeat">Repeat</label>
        <select class="input" id="rem-repeat">${Object.entries(REPEATS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
        <span class="hint" id="rem-repeat-hint" hidden></span></div>
      <div class="field"><label for="rem-note">Details</label><textarea class="input area" id="rem-note" maxlength="1000" placeholder="Optional"></textarea></div>
      ${r && r.noteId && state.notes[r.noteId] && !(state.view.name === 'editor' && state.view.id === r.noteId) ? `<button class="text-btn" type="button" id="rem-open-note">${ICON.note.replace('width="20" height="20"', 'width="15" height="15"')} Open note: ${esc(noteName(state.notes[r.noteId]))}</button>` : ''}
      <div id="rem-warn"></div>
      <div class="sheet-actions">
        ${editing ? '<button class="danger-link" type="button" id="rem-del">Delete</button>' : '<span></span>'}
        <div class="btn-row"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" id="rem-save">${editing ? 'Save' : 'Add reminder'}</button></div>
      </div>`, () => {
      const f = id => document.getElementById(id);
      f('rem-title').value = r ? r.title : ''; f('rem-date').value = r ? r.date || '' : ''; f('rem-time').value = r ? r.time || '' : ''; f('rem-note').value = r ? r.note || '' : '';
      f('rem-repeat').value = r && REPEATS[r.repeat || ''] ? (r.repeat || '') : '';
      if (!r && presetDate) f('rem-date').value = presetDate;
      const syncRepeat = () => {
        const rep = f('rem-repeat').value, h = f('rem-repeat-hint');
        if (rep && !f('rem-date').value) { f('rem-date').value = dayOffset(0); syncQuick(); }
        h.hidden = !rep;
        if (rep) {
          const tmp = { date: f('rem-date').value, repeat: rep, rday: +f('rem-date').value.slice(8, 10) };
          h.textContent = 'After that: ' + dueLabel({ date: advance(tmp.date, rep, tmp.rday) }) + '. Ticking it off moves it to the next date.';
        }
      };
      const syncQuick = () => sheetBody.querySelectorAll('[data-quick]').forEach(c => {
        const q = c.dataset.quick, on = q === 'none' ? !f('rem-date').value : f('rem-date').value === dayOffset(+q);
        c.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      const syncSave = () => { f('rem-save').disabled = !f('rem-title').value.trim(); };
      syncQuick(); syncSave(); syncRepeat();
      f('rem-repeat').addEventListener('change', syncRepeat);
      f('rem-date').addEventListener('change', syncRepeat);
      f('rem-title').addEventListener('input', syncSave);
      f('rem-title').addEventListener('keydown', e => { if (e.key === 'Enter' && f('rem-title').value.trim()) f('rem-save').click(); });
      f('rem-date').addEventListener('input', syncQuick);
      f('rem-time').addEventListener('input', () => { if (f('rem-time').value && !f('rem-date').value) { f('rem-date').value = dayOffset(0); syncQuick(); } });
      sheetBody.querySelectorAll('[data-quick]').forEach(c => c.addEventListener('click', () => {
        const q = c.dataset.quick;
        if (q === 'none') { f('rem-date').value = ''; f('rem-time').value = ''; f('rem-repeat').value = ''; } else f('rem-date').value = dayOffset(+q);
        syncQuick(); syncRepeat();
      }));
      if (!editing) setTimeout(() => f('rem-title').focus(), 260);
      f('rem-save').addEventListener('click', () => {
        const title = f('rem-title').value.trim(); if (!title) return;
        const now = Date.now();
        const date = f('rem-date').value || '';
        const repeat = date ? f('rem-repeat').value : '';
        const rec = { id: r ? r.id : newId('r'), kind: 'reminder', title, date, time: date ? (f('rem-time').value || '') : '', repeat, rday: repeat ? +date.slice(8, 10) : null, note: f('rem-note').value.trim(), done: r ? !!r.done : false, doneAt: r ? r.doneAt || null : null, created: r ? r.created : now, updated: now };
        if (repeat && rec.done) { rec.done = false; rec.doneAt = null; }
        saveReminder(rec); closeSheet(); render();
        toast(editing ? 'Reminder saved' : 'Reminder added');
      });
      const openNote = f('rem-open-note');
      if (openNote) openNote.addEventListener('click', () => { closeSheet(); go({ name: 'editor', id: r.noteId, from: fromHere() }); });
      const delBtn = f('rem-del');
      if (delBtn) delBtn.addEventListener('click', () => {
        f('rem-warn').innerHTML = `<div class="warnbox"><p>Delete “${esc(r.title)}”?</p><div class="btn-row"><button class="btn" type="button" id="rd-no">Keep it</button><button class="btn danger" type="button" id="rd-yes">Delete</button></div></div>`;
        f('rd-no').addEventListener('click', () => { f('rem-warn').innerHTML = ''; });
        f('rd-yes').addEventListener('click', () => { trash(r.id); delete state.reminders[r.id]; closeSheet(); render(); toast('Reminder moved to Trash', 0, { label: 'Undo', fn: () => untrash(r.id) }); });
      });
    });
  }

  /* ---------- sheets ---------- */
  function openSheet(html, onReady) {
    sheetBody.innerHTML = html; sheet.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('open')));
    if (onReady) onReady();
  }
  function closeSheet() {
    sheet.classList.remove('open');
    setTimeout(() => { if (!sheet.classList.contains('open')) { sheet.hidden = true; sheetBody.innerHTML = ''; } }, 220);
  }
  function openGroupSheet(group, onSaved) {
    const editing = !!group;
    const color = group ? group.color : COLORS[state.groups.length % COLORS.length];
    const count = editing ? notesIn(group.id).length : 0;
    openSheet(`<h2 id="sheet-title">${editing ? 'Edit group' : 'New group'}</h2>
      <div class="field"><label for="group-name">Name</label><input class="input" id="group-name" maxlength="40" placeholder="e.g. Work, Recipes, Trip to Galway" autocomplete="off"></div>
      <fieldset class="swatches"><legend>Colour</legend>
        ${COLORS.map(c => `<label class="swatch" title="${COLOR_NAMES[c]}"><input type="radio" name="gcolor" id="gc-${c}" value="${c}" ${c === color ? 'checked' : ''} aria-label="${COLOR_NAMES[c]}"><span style="--gc:var(--g-${c})"></span></label>`).join('')}
      </fieldset>
      <div class="field"><span>Icon</span>${iconGrid(group && group.icon, true)}</div>
      <div id="group-warn"></div>
      <div class="sheet-actions">
        ${editing ? '<button class="danger-link" type="button" id="group-del">Delete group</button>' : '<span></span>'}
        <div class="btn-row"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" id="group-save">${editing ? 'Save' : 'Create group'}</button></div>
      </div>`, () => {
      const nameEl = document.getElementById('group-name'), save = document.getElementById('group-save');
      nameEl.value = group ? group.name : '';
      const sync = () => { save.disabled = !nameEl.value.trim(); };
      sync(); nameEl.addEventListener('input', sync);
      nameEl.addEventListener('keydown', e => { if (e.key === 'Enter' && nameEl.value.trim()) save.click(); });
      setTimeout(() => nameEl.focus(), 260);
      save.addEventListener('click', () => {
        const name = nameEl.value.trim(); if (!name) return;
        const c = (sheetBody.querySelector('input[name="gcolor"]:checked') || {}).value || 'slate';
        let g;
        const ic = (sheetBody.querySelector('.ico[aria-pressed="true"]') || {}).dataset;
        const icon = ic && ic.ico ? ic.ico : '';
        if (editing) { g = groupById(group.id); g.name = name; g.color = c; if (icon) g.icon = icon; else delete g.icon; }
        else { g = { id: newId('g'), name, color: c, ...(icon ? { icon } : {}) }; state.groups.push(g); }
        saveGroups(); closeSheet();
        if (onSaved) onSaved(g); else { app.dataset.view = ''; render(); }
        toast(editing ? 'Group saved' : `Created “${name}”`);
      });
      const delBtn = document.getElementById('group-del');
      if (delBtn) delBtn.addEventListener('click', () => {
        document.getElementById('group-warn').innerHTML = `<div class="warnbox"><p>Delete “${esc(group.name)}”? ${count ? `Its ${plural(count, 'note')} will move to No group. The notes themselves stay.` : 'It has no notes.'}</p>
          <div class="btn-row"><button class="btn" type="button" id="del-cancel">Keep group</button><button class="btn danger" type="button" id="del-go">Delete group</button></div></div>`;
        document.getElementById('del-cancel').addEventListener('click', () => { document.getElementById('group-warn').innerHTML = ''; });
        document.getElementById('del-go').addEventListener('click', () => {
          state.groups = state.groups.filter(x => x.id !== group.id);
          for (const n of Object.values(state.notes)) if (n.group === group.id) { n.group = ''; saveNote(n.id); }
          saveGroups(); closeSheet(); go({ name: 'home' }); toast('Group deleted');
        });
      });
    });
  }
  /* ----- icons ----- */
  const ICONS = ['\u{1F4DD}', '\u{1F4CC}', '\u{1F4A1}', '⭐', '❤️', '\u{1F3E0}', '\u{1F4BC}', '\u{1F3E2}', '\u{1F4CB}', '\u{1F4CA}', '\u{1F4C5}', '✅', '\u{1F3AF}', '\u{1F6D2}', '\u{1F373}', '\u{1F35E}', '☕', '\u{1F381}', '✈️', '\u{1F697}', '\u{1F3C3}', '\u{1F9D8}', '\u{1F4DA}', '\u{1F3B5}', '\u{1F3AC}', '\u{1F3AE}', '\u{1F4B0}', '\u{1F9FE}', '\u{1F511}', '\u{1F527}', '\u{1F331}', '\u{1F436}', '\u{1F476}', '\u{1F389}', '\u{1F3D6}️', '⛰️', '\u{1F48A}', '\u{1F4DE}', '✉️', '\u{1F9E0}'];
  function iconGrid(sel, withNone) {
    const list = sel && !ICONS.includes(sel) ? [sel, ...ICONS] : ICONS;
    return `<div class="ico-grid" role="group" aria-label="Icons">${withNone ? `<button type="button" class="ico ico-none" data-ico="" aria-pressed="${!sel}" aria-label="No icon">${ICON.x}</button>` : ''}${list.map(i => `<button type="button" class="ico" data-ico="${esc(i)}" aria-pressed="${i === sel}" aria-label="Icon ${esc(i)}">${esc(i)}</button>`).join('')}</div>`;
  }
  /* picking inside any icon grid marks that one */
  sheetBody.addEventListener('click', e => {
    const b = e.target.closest('.ico'); if (!b) return;
    b.closest('.ico-grid').querySelectorAll('.ico').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  });
  const firstGlyph = s => { s = (s || '').trim(); if (!s) return ''; try { const seg = new Intl.Segmenter(undefined, { granularity: 'grapheme' }); return [...seg.segment(s)][0].segment; } catch (e) { return [...s][0]; } };
  function openNoteIcon(id) {
    const n = state.notes[id]; if (!n || state.readOnly) return;
    openSheet(`<h2 id="sheet-title">Note icon</h2>${iconGrid(n.icon)}
      <div class="field"><label for="ico-own">Or use any emoji</label><div class="inline"><input class="input" id="ico-own" maxlength="16" autocomplete="off" placeholder="Paste or type one"><button class="btn" type="button" id="ico-use">Use</button></div></div>
      <div class="sheet-actions">${n.icon ? '<button class="danger-link" type="button" id="ico-rm">Remove icon</button>' : '<span></span>'}<button class="btn" type="button" data-close>Cancel</button></div>`, () => {
      const set = ic => { if (ic) n.icon = ic; else delete n.icon; touch(id); closeSheet(); updateEditorChrome(id); };
      sheetBody.querySelectorAll('.ico').forEach(b => b.addEventListener('click', () => set(b.dataset.ico)));
      document.getElementById('ico-use').addEventListener('click', () => { const g = firstGlyph(document.getElementById('ico-own').value); if (g) set(g); });
      const rm = document.getElementById('ico-rm'); if (rm) rm.addEventListener('click', () => set(''));
    });
  }

  function openPicker(noteId) {
    const n = state.notes[noteId];
    const row = (gid, name, color) => `<button type="button" data-pick="${esc(gid)}" style="--gc:var(--g-${esc(color)})">
        ${gid && (groupById(gid) || {}).icon ? iconHtml(groupById(gid).icon, 'n-icon') : `<i class="dot" ${gid ? '' : 'style="background:transparent;border:1.5px solid var(--muted)"'}></i>`}<span class="name">${esc(name)}</span>${(n.group || '') === gid ? ICON.check : ''}</button>`;
    openSheet(`<h2 id="sheet-title">Move to group</h2>
      <div class="pick">${row('', 'No group', 'slate')}${state.groups.map(g => row(g.id, g.name, g.color)).join('')}
        <button type="button" class="new" data-pick-new>${ICON.plus}<span class="name">New group</span></button></div>`, () => {
      sheetBody.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
        n.group = b.dataset.pick; dirty[noteId] = false; saveNote(noteId); closeSheet(); updateEditorChrome(noteId);
      }));
      sheetBody.querySelector('[data-pick-new]').addEventListener('click', () => {
        closeSheet();
        setTimeout(() => openGroupSheet(null, g => { n.group = g.id; saveNote(noteId); updateEditorChrome(noteId); }), 230);
      });
    });
  }

  /* ---------- examples ---------- */
  function addExamples() {
    if (state.readOnly) return;
    const now = Date.now(), m = 60000, h = 60 * m;
    const ideas = { id: newId('g'), name: 'Ideas', color: 'ochre' };
    const recipes = { id: newId('g'), name: 'Recipes', color: 'moss' };
    const work = { id: newId('g'), name: 'Work', color: 'tide' };
    state.groups.push(work, recipes, ideas); saveGroups();
    const ex = [
      [work.id, 'Monday stand-up', '- Ship the onboarding copy\n- Ask Sam about the Q4 dates\n- Book a room for Thursday’s review', true, 25 * m],
      [work.id, 'Feedback for Aoife', 'The demo flow was clear. Suggest trimming the pricing slide and leading with the customer quote.', false, 26 * h],
      [recipes.id, 'Brown bread', '400 g wholemeal flour\n100 g plain flour\n1 tsp bread soda\n1 tsp salt\n450 ml buttermilk\n\n200 °C for 45 min. Tap the bottom: it should sound hollow.', false, 3 * h],
      [ideas.id, 'Weekend project: bird feeder', 'Cedar offcuts from the shed. Roof needs a 2 cm overhang so rain stays out of the seed tray.\n\nFind out which seeds bring goldfinches.', false, 5 * h],
      [ideas.id, 'Gift ideas', 'Mam: walking guide to the Wicklow Way\nCiara: pottery class voucher\nDad: a new flask for the bike', false, 50 * h],
      ['', 'Things to pick up', 'AA batteries\nPost the parcel\nPhone charger for the car', false, 8 * m]
    ];
    for (const [group, title, body, pinned, age] of ex) {
      const id = newId('n');
      state.notes[id] = { id, kind: 'note', title, body, group, pinned, example: true, created: now - age, updated: now - age };
      state.notes[id].blocks = textToBlocks(title === 'Things to pick up' ? body.split('\n').map((l, i) => `- [${i === 1 ? 'x' : ' '}] ` + l).join('\n') : body);
      if (title === 'Monday stand-up') state.notes[id].icon = '\u{1F4CB}';
      if (title === 'Brown bread') state.notes[id].icon = '\u{1F35E}';
      saveNote(id);
    }
    render();
  }

  /* ---------- events ---------- */
  function showConfirm(msg, yesLabel, yesAction) {
    document.getElementById('ed-confirm').innerHTML = `<div class="confirm"><div class="confirm-in"><p>${msg}</p><div class="btn-row"><button class="btn" type="button" data-action="cancel-confirm">Cancel</button><button class="btn danger" type="button" data-action="${yesAction}">${yesLabel}</button></div></div></div>`;
  }
  app.addEventListener('click', e => {
    const cp = e.target.closest('[data-copy]');
    if (cp) { const inp = document.getElementById(cp.dataset.copy); if (inp && inp.value) copyText(inp.value, cp.dataset.copy === 'pw-pass' ? 'Password' : 'Username', inp); return; }
    const el = e.target.closest('[data-action]'); if (!el) return;
    const a = el.dataset.action, id = el.dataset.id;
    switch (a) {
      case 'open-note': go({ name: 'editor', id, from: fromHere() }); break;
      case 'note-icon': openNoteIcon(state.view.id); break;
      case 'settings': openSettings(); break;
      case 'backup-now': openBackupSheet(); break;
      case 'backup-snooze': { state.prefs = { kind: 'prefs', ...(state.prefs || {}), backupSnooze: Date.now() }; put('prefs', state.prefs); render(); break; }
      case 'app-update': if (state.update) NATIVE.openUrl(state.update.url); break;
      case 'open-trash': go({ name: 'trash', kind: el.dataset.kind }); break;
      case 'trash-back': go({ name: el.dataset.to }); break;
      case 'trash-restore': { untrash(id); toast('Restored'); break; }
      case 'trash-del': { state.delId = id; showConfirm('Delete this for good? This can\u2019t be undone.', 'Delete forever', 'trash-del-yes'); break; }
      case 'trash-del-yes': { if (state.delId) { del(state.delId); delete state.trash[state.delId]; delete plain[state.delId]; state.delId = null; } derive(); toast('Deleted for good'); break; }
      case 'trash-empty': { const n = trashOf(state.view.kind).length; showConfirm(`Delete all ${n} items in Trash for good?`, 'Empty trash', 'trash-empty-yes'); break; }
      case 'trash-empty-yes': { for (const t of trashOf(state.view.kind)) { del(t.id); delete state.trash[t.id]; delete plain[t.id]; } derive(); toast('Trash emptied'); break; }
      case 'today-note': createNote(''); break;
      case 'today-list': createNote('', true); break;
      case 'new-list': createNote(state.view.name === 'group' ? state.view.id : '', true); break;
      case 'go-tab': switchTab(el.dataset.tab); break;
      case 'open-group': go({ name: 'group', id }); break;
      case 'home': go({ name: 'home' }); break;
      case 'new-group': if (!state.readOnly) openGroupSheet(null); break;
      case 'edit-group': openGroupSheet(groupById(id)); break;
      case 'new-note': createNote(state.view.name === 'group' ? state.view.id : ''); break;
      case 'examples': addExamples(); break;
      case 'leave-editor': leaveEditor(); break;
      case 'pick-group': if (!state.readOnly) openPicker(state.view.id); break;
      case 'toggle-pin': {
        if (state.readOnly) break;
        const n = state.notes[state.view.id]; n.pinned = !n.pinned;
        saveNote(n.id); updateEditorChrome(n.id); break;
      }
      case 'ask-delete': if (!state.readOnly) showConfirm('Move this note to Trash? You can restore it for 30 days.', 'Delete', 'do-delete'); break;
      case 'cancel-confirm': document.getElementById('ed-confirm').innerHTML = ''; break;
      case 'do-delete': {
        const nid = state.view.id; clearTimeout(timers[nid]);
        if (dirty[nid]) { dirty[nid] = false; saveNote(nid); }
        const had = !!raw[nid];
        if (had) trash(nid);
        delete state.notes[nid];
        go(state.view.from || { name: 'home' });
        if (had) toast('Note moved to Trash', 0, { label: 'Undo', fn: () => untrash(nid) }); else toast('Note deleted');
        break;
      }
      /* passwords */
      case 'vault-lock': lockVault(); break;
      case 'vault-menu': openVaultMenu(); break;
      case 'vault-restore': openRestoreSheet(); break;
      case 'vault-forgot': {
        const n = Object.keys(state.secrets).length;
        document.getElementById('forgot').innerHTML = `<div class="warnbox"><p>Without the master password, nobody can decrypt your saved passwords, including you. You can erase the vault and start a new one. This permanently deletes ${plural(n, 'saved password')}.</p>
          <div class="btn-row"><button class="btn" type="button" data-action="forgot-cancel">Keep vault</button><button class="btn danger" type="button" data-action="vault-erase">Erase vault</button></div></div>`;
        break;
      }
      case 'forgot-cancel': document.getElementById('forgot').innerHTML = ''; break;
      case 'vault-erase': {
        for (const sid of Object.keys(raw)) if (raw[sid] && raw[sid].kind === 'secret') del(sid);
        del('vault'); if (raw.pwmeta) del('pwmeta');
        state.secrets = {}; state.vault = null; state.pwMetaBox = null; vaultKey = null; plain = {}; meta = { iv: null, companies: [] }; state.pwCompany = '';
        app.dataset.view = ''; render(); toast('Vault erased'); break;
      }
      case 'pw-new': go({ name: 'pw-entry', id: newId('s'), isNew: true }); break;
      case 'pw-open': go({ name: 'pw-entry', id, from: state.view.name === 'pw-site' ? { name: 'pw-site', key: state.view.key } : state.view.name === 'pw-health' ? { name: 'pw-health' } : { name: 'pw' } }); break;
      case 'pw-health': go({ name: 'pw-health' }); break;
      case 'pw-site-open': go({ name: 'pw-site', key: el.dataset.key }); break;
      case 'pw-home': go({ name: 'pw' }); break;
      case 'pw-company': { state.pwCompany = id || ''; renderPwBody(); break; }
      case 'pw-companies': openCompaniesSheet(); break;
      case 'pw-space': {
        state.pwSpace = el.dataset.space === 'work' ? 'work' : 'personal';
        try { localStorage.setItem('stacks-pw-space', state.pwSpace); } catch (e) {}
        renderPwBody(); break;
      }
      case 'pw-add-account': addAccountFor(state.view.key); break;
      case 'pw-add-sibling': {
        const cur = plain[state.view.id] && plain[state.view.id].data; if (!cur) break;
        const k = groupKey(cur); if (!k) break;
        if (pwDirty) { toast('Save your changes first, then add the other account.'); break; }
        addAccountFor(k); break;
      }
      case 'pw-copy': { const p = plain[id]; if (p && p.data && p.data.pass) copyText(p.data.pass, 'Password'); break; }
      case 'pw-back': if (pwDirty && !state.readOnly) showConfirm('Discard your unsaved changes?', 'Discard', 'pw-discard'); else go(state.view.from || { name: 'pw' }); break;
      case 'pw-discard': pwDirty = false; go(state.view.from || { name: 'pw' }); break;
      case 'pw-ask-delete': showConfirm('Move this password to Trash? You can restore it for 30 days.', 'Delete', 'pw-delete'); break;
      case 'pw-delete': {
        const sid = state.view.id, from = state.view.from || { name: 'pw' };
        trash(sid); delete state.secrets[sid]; pwDirty = false;
        const left = from.name === 'pw-site' ? findSite(from.key) : null;
        go(from.name === 'pw-health' || (left && left.items.length > 1) ? from : { name: 'pw' });
        toast('Password moved to Trash', 0, { label: 'Undo', fn: () => untrash(sid) }); break;
      }
      case 'pw-del-broken': {
        state.delId = id;
        showConfirm('Delete this entry? It can’t be opened with your current master password.', 'Delete', 'pw-del-broken-yes'); break;
      }
      case 'pw-del-broken-yes': {
        const sid = state.delId; state.delId = null;
        if (sid) { del(sid); delete state.secrets[sid]; delete plain[sid]; }
        render(); toast('Entry deleted'); break;
      }
      case 'pw-del-broken-all': {
        const n = Object.values(plain).filter(p => p && p.error).length;
        showConfirm(`Delete all ${n} entries that can’t be opened?`, 'Delete all', 'pw-del-broken-all-yes'); break;
      }
      case 'pw-del-broken-all-yes': {
        let n = 0;
        for (const sid of Object.keys(plain)) if (plain[sid] && plain[sid].error) { del(sid); delete state.secrets[sid]; delete plain[sid]; n++; }
        render(); toast(`Deleted ${plural(n, 'entry').replace('entrys', 'entries')}`); break;
      }
      /* reminders */
      case 'rem-new': openReminderSheet(null); break;
      case 'rem-open': openReminderSheet(state.reminders[id]); break;
      case 'rem-toggle': completeReminder(id); break;
      case 'rem-snooze': openSnoozeSheet(id); break;
      case 'rem-view': { state.remView = el.dataset.v === 'cal' ? 'cal' : 'list'; try { localStorage.setItem('stacks-rem-view', state.remView); } catch (e) {} render(); break; }
      case 'cal-day': { state.calDay = el.dataset.date; render(); break; }
      case 'cal-move': { const [cy, cm] = state.calMonth.split('-').map(Number); const d = new Date(cy, cm - 1 + +el.dataset.d, 1); state.calMonth = ymd(d).slice(0, 7); state.calDay = null; render(); break; }
      case 'cal-today': { state.calMonth = null; state.calDay = null; render(); break; }
      case 'cal-add': openReminderSheet(null, state.calDay); break;
      case 'rem-clear': {
        const n = Object.values(state.reminders).filter(r => r.done).length;
        document.getElementById('rem-clear-box').innerHTML = `<div class="warnbox"><p>Delete ${plural(n, 'completed reminder')}?</p><div class="btn-row"><button class="btn" type="button" data-action="rem-clear-no">Cancel</button><button class="btn danger" type="button" data-action="rem-clear-yes">Delete</button></div></div>`;
        break;
      }
      case 'rem-clear-no': document.getElementById('rem-clear-box').innerHTML = ''; break;
      case 'rem-clear-yes': {
        const ids = Object.values(state.reminders).filter(r => r.done).map(r => r.id);
        for (const rid of ids) { trash(rid); delete state.reminders[rid]; }
        render(); toast(`${plural(ids.length, 'reminder')} moved to Trash`, 0, { label: 'Undo', fn: () => untrash(ids) }); break;
      }
    }
  });
  app.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'vault-setup') setupVault();
    else if (e.target.id === 'vault-unlock') unlockVault();
    else if (e.target.id === 'pw-form' && !state.readOnly) savePwEntry();
  });
  app.addEventListener('input', e => {
    if (e.target.id === 'search') { state.query = e.target.value; renderHomeBody(); }
    else if (e.target.id === 'pw-search') { state.pwQuery = e.target.value; renderPwBody(); }
  });
  tabs.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) switchTab(b.dataset.tab); });
  fab.addEventListener('click', () => {
    const t = tabOf(state.view);
    if (t === 'notes') createNote(state.view.name === 'group' ? state.view.id : '');
    else if (t === 'reminders') openReminderSheet(null);
    else if (t === 'passwords' && vaultKey) {
      if (state.view.name === 'pw-site') addAccountFor(state.view.key);
      else go({ name: 'pw-entry', id: newId('s'), isNew: true });
    }
  });
  sheet.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
  document.addEventListener('keydown', e => {
    lastActive = Date.now();
    if (e.key !== 'Escape') return;
    if (!sheet.hidden) closeSheet();
    else if (state.view.name === 'editor') leaveEditor();
  });
  ['pointerdown', 'input'].forEach(ev => document.addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true }));
  window.addEventListener('pagehide', () => { for (const id in dirty) if (dirty[id]) { dirty[id] = false; saveNote(id); } });

  function checkLock() { if (vaultKey && Date.now() - lastActive > LOCK_AFTER) { lockVault(true); toast('Passwords locked after 5 minutes without activity', 4000); } }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkLock(); if (state.view.name === 'rem' || state.view.name === 'today') render(); } });
  let lastDueCheck = Date.now();
  setInterval(() => {
    checkLock();
    const now = Date.now();
    for (const r of Object.values(state.reminders)) {
      if (r.done || !r.date || !r.time) continue;
      const t = dueMs(r);
      if (t > lastDueCheck && t <= now && (!NATIVE || notifState !== 'granted')) toast('Due now: ' + r.title, 8000);
    }
    lastDueCheck = now;
    if (state.loaded) {
      if (state.view.name === 'rem' || state.view.name === 'today') render();
      else { const dc = dueCount(), badge = document.getElementById('rem-badge'); badge.hidden = !dc; badge.textContent = dc; }
      if (state.view.name === 'editor') updateEditorMeta(state.view.id);
    }
  }, 15000);

  /* start on the section from the link (#passwords, #reminders) or the last one used */
  let startTab = (location.hash || '').slice(1);
  if (!ROOT[startTab]) { try { startTab = localStorage.getItem(TAB_KEY) || 'today'; } catch (e) { startTab = 'today'; } }
  if (!ROOT[startTab]) startTab = 'today';
  state.view = ROOT[startTab];
  try { if (localStorage.getItem('stacks-pw-space') === 'work') state.pwSpace = 'work'; if (localStorage.getItem('stacks-rem-view') === 'cal') state.remView = 'cal'; } catch (e) {}
  init();
})();
</script>
