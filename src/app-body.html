<title>Stacks Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single phone-width column with a bottom tab bar (Notes / Passwords / Reminders); groups drawn as stacked index cards, lists as quiet panels, full-page editors. */
:root {
  --bg: #F3F5F4;
  --surface: #FFFFFF;
  --sunken: #E9EDEB;
  --ink: #17201D;
  --muted: #63706B;
  --line: #DCE2DF;
  --accent: #1E5D54;
  --accent-ink: #FFFFFF;
  --danger: #B3363F;
  --warn: #9A6A0C;
  --shadow: 0 1px 2px rgba(23,32,29,.06), 0 6px 18px rgba(23,32,29,.06);
  --scrim: rgba(16,22,20,.38);
  --bar: rgba(255,255,255,.9);

  --g-tide: #2C6EA3;
  --g-moss: #4F8540;
  --g-ochre: #A9760F;
  --g-rose: #B1435A;
  --g-plum: #82488A;
  --g-slate: #5A6670;

  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101413; --surface: #191F1D; --sunken: #141A18; --ink: #E6ECE9; --muted: #93A09B;
    --line: #2A3330; --accent: #7AC4B5; --accent-ink: #0D1A17; --danger: #EF8A92; --warn: #E2B555;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.28); --scrim: rgba(0,0,0,.55); --bar: rgba(25,31,29,.92);
    --g-tide: #7DB2DF; --g-moss: #91C27E; --g-ochre: #E2B555; --g-rose: #E68B9D; --g-plum: #CD98D0; --g-slate: #A2AEB7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101413; --surface: #191F1D; --sunken: #141A18; --ink: #E6ECE9; --muted: #93A09B;
  --line: #2A3330; --accent: #7AC4B5; --accent-ink: #0D1A17; --danger: #EF8A92; --warn: #E2B555;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.28); --scrim: rgba(0,0,0,.55); --bar: rgba(25,31,29,.92);
  --g-tide: #7DB2DF; --g-moss: #91C27E; --g-ochre: #E2B555; --g-rose: #E68B9D; --g-plum: #CD98D0; --g-slate: #A2AEB7;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg { display: block; flex: none; }

.app { max-width: 600px; margin: 0 auto; padding-inline: 16px; padding-block: 0 170px; }
.app.detail { padding-block: 0 110px; }

/* Top bars */
.top { position: sticky; top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)); z-index: 5; background: var(--bg); padding-block: 14px 12px; display: grid; gap: 12px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
h1 { font: 750 2.1rem/1.05 var(--f-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: .875rem; font-variant-numeric: tabular-nums; }

.search { display: flex; align-items: center; gap: 10px; background: var(--sunken); border: 1px solid transparent; border-radius: 12px; padding-inline: 12px; height: 44px; color: var(--muted); }
.search:focus-within { border-color: var(--accent); background: var(--surface); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; height: 100%; color: var(--ink); }
.search input::placeholder { color: var(--muted); }

.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--ink); }
.icon-btn:hover { background: var(--sunken); }
.icon-btn[aria-pressed="true"] { color: var(--accent); }
.back { display: inline-flex; align-items: center; gap: 2px; height: 40px; padding-inline: 4px 10px; margin-left: -6px; border-radius: 12px; color: var(--accent); font-weight: 600; min-width: 0; }
.back:hover { background: var(--sunken); }
.back span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34vw; }

/* Sections */
.section { display: grid; gap: 12px; margin-top: 18px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.label { font: 600 .75rem/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.label.overdue { color: var(--danger); }
.text-btn { color: var(--accent); font-weight: 600; font-size: .9rem; padding: 6px 4px; border-radius: 8px; justify-self: start; }

/* Group stacks */
.stacks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 12px; padding-top: 10px; isolation: isolate; }
.stack { --gc: var(--g-slate); position: relative; display: grid; gap: 8px; align-content: start; text-align: left; min-height: 124px; padding: 14px 14px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); transition: transform .15s ease; }
.stack::before, .stack::after { content: ""; position: absolute; z-index: -1; height: 14px; border: 1px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0; background: color-mix(in oklab, var(--gc) 22%, var(--surface)); }
.stack::before { top: -6px; left: 7px; right: 7px; }
.stack::after { top: -11px; left: 15px; right: 15px; background: color-mix(in oklab, var(--gc) 40%, var(--surface)); }
.stack.single::after, .stack.empty::after { display: none; }
.stack.empty::before { display: none; }
.stack:hover { transform: translateY(-2px); }
.stack-name { display: flex; align-items: center; gap: 8px; font: 650 1.05rem/1.2 var(--f-display); min-width: 0; }
.stack-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gc); flex: none; }
.stack-count { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.stack-peek { display: grid; gap: 2px; font-size: .82rem; color: var(--muted); min-width: 0; }
.stack-peek span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stack.add { background: transparent; box-shadow: none; border: 1.5px dashed var(--line); color: var(--muted); place-content: center; justify-items: center; gap: 6px; font-weight: 600; }
.stack.add::before, .stack.add::after { display: none; }
.stack.add:hover { color: var(--accent); border-color: var(--accent); }

/* Lists */
.list { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }
.note { display: grid; gap: 4px; text-align: left; padding: 14px 16px; min-width: 0; }
.note:hover { background: var(--sunken); }
.note-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.note-title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-head svg { color: var(--accent); }
.note-snip { color: var(--muted); font-size: .9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.note-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; }
.gtag { --gc: var(--g-slate); display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 500; }
.gtag i { width: 8px; height: 8px; border-radius: 50%; background: var(--gc); }
.ex { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: .7rem; letter-spacing: .04em; }

/* Reminders */
.rem { display: flex; align-items: flex-start; gap: 4px; padding-inline: 8px 12px; min-width: 0; }
.tick { flex: none; width: 44px; height: 48px; display: grid; place-items: center; }
.tick span { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s; }
.rem.overdue .tick span { border-color: var(--danger); }
.tick[aria-pressed="true"] span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rem-main { flex: 1; min-width: 0; display: grid; gap: 2px; text-align: left; padding-block: 13px; }
.rem-title { font-weight: 500; overflow-wrap: anywhere; }
.rem.done .rem-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.rem-due { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
.rem.overdue .rem-due { color: var(--danger); font-weight: 600; }
.rem.today .rem-due { color: var(--accent); font-weight: 600; }
.trash-row { display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 16px; min-width: 0; }
.trash-text { flex: 1; min-width: 0; display: grid; }
.trash-row .btn { height: 36px; padding-inline: 12px; flex: none; }
.trash-row .icon-btn { color: var(--muted); }
.trash-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 18px; color: var(--muted); font-weight: 500; }
.cal-head { display: flex; align-items: center; gap: 4px; }
.cal-title { font: 650 1.15rem/1.2 var(--f-display); flex: 1; text-align: center; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
.cal-dow { text-align: center; font-size: .7rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-block: 4px 6px; }
.cal-cell { display: grid; justify-items: center; align-content: start; gap: 3px; height: 50px; padding-top: 5px; border-radius: 10px; font-variant-numeric: tabular-nums; }
button.cal-cell:hover { background: var(--sunken); }
.cal-n { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; font-size: .92rem; }
.cal-cell.is-today .cal-n { color: var(--accent); font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--accent); }
.cal-cell.is-sel .cal-n { background: var(--accent); color: var(--accent-ink); font-weight: 700; box-shadow: none; }
.cal-dots { display: flex; gap: 3px; height: 5px; }
.cal-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.cal-dots i.is-over { background: var(--danger); }
.cal-dots i.is-done { background: var(--line); }
.tick-ghost { color: var(--muted); display: grid; place-items: center; }
.rem-from { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; color: var(--accent); font-weight: 500; }
.rem-note { font-size: .85rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* Passwords */
.pw-row { display: flex; align-items: center; gap: 4px; padding-inline: 0 8px; min-width: 0; }
.pw-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 14px; text-align: left; }
.pw-main:hover { background: var(--sunken); }
.avatar { --gc: var(--g-slate); flex: none; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font: 650 1.05rem/1 var(--f-display); color: var(--gc); background: color-mix(in oklab, var(--gc) 16%, var(--surface)); }
.pw-text { display: grid; min-width: 0; }
.pw-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pw-user { color: var(--muted); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pw-row .icon-btn { color: var(--muted); }
.pw-row .chev { color: var(--muted); margin-right: 8px; }
.count-pill { flex: none; min-width: 26px; height: 24px; padding-inline: 8px; border-radius: 999px; background: var(--sunken); color: var(--ink); font-size: .78rem; font-weight: 600; line-height: 24px; text-align: center; font-variant-numeric: tabular-nums; }
.site-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
.site-title h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pw-mask { font-family: var(--f-mono); letter-spacing: .1em; }
.after-list { margin-top: 14px; }
/* Personal / Work switch */
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--sunken); border-radius: 13px; border: 0; margin: 0; min-width: 0; }
.seg > button, .seg > label > span { --gc: var(--g-slate); height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: .92rem; color: var(--muted); }
.seg > label { position: relative; display: block; }
.seg > label input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.seg > button[aria-pressed="true"], .seg > label input:checked + span { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.seg > label input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg i { width: 8px; height: 8px; border-radius: 50%; background: var(--gc); }
.seg .n { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
/* Company chips + companies sheet */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px; margin: -2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips .chip { flex: none; }
.chip .n { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.chip.add { border-style: dashed; color: var(--accent); background: transparent; }
.co-list { display: grid; gap: 8px; }
.co-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.co-row .input { flex: 1; min-width: 0; }
.co-row .sub { flex: none; white-space: nowrap; }
.icon-btn:disabled { opacity: .35; cursor: default; background: none; }
select.input { appearance: auto; padding-inline: 12px; }
.space-tag { --gc: var(--g-slate); display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; font-size: .72rem; font-weight: 600; color: var(--ink); }
.space-tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--gc); }
.lock-mark { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in oklab, var(--accent) 14%, var(--surface)); color: var(--accent); }
.form { display: grid; gap: 14px; width: 100%; }
.inline { display: flex; gap: 6px; align-items: center; }
.inline .input { flex: 1; min-width: 0; }
.mono { font-family: var(--f-mono); letter-spacing: .02em; }
.err { color: var(--danger); font-size: .9rem; margin: 0; }
.hint { color: var(--muted); font-size: .85rem; margin: 0; }
.strength { font-size: .8rem; font-weight: 600; }
.strength.weak { color: var(--danger); }
.strength.okay { color: var(--warn); }
.strength.strong { color: var(--accent); }
.field-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }

/* Group header */
.group-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
.group-title .dot { width: 14px; height: 14px; }
.group-title h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Empty states */
.empty-card { display: grid; gap: 12px; justify-items: start; padding: 22px 20px; margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.empty-card h2 { margin: 0; font: 650 1.25rem/1.25 var(--f-display); text-wrap: balance; }
.empty-card p { margin: 0; color: var(--muted); max-width: 46ch; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding-inline: 18px; border-radius: 12px; font-weight: 600; background: var(--sunken); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--danger); color: var(--surface); }
.btn:disabled { opacity: .45; cursor: default; }
.loading { color: var(--muted); padding-block: 40px; text-align: center; }

.status { margin-top: 28px; color: var(--muted); font-size: .78rem; display: flex; align-items: flex-start; gap: 8px; }
.status i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: .5em; flex: none; }

/* Floating action button */
.fab { position: fixed; z-index: 9; right: max(16px, calc(50% - 284px)); bottom: calc(80px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))); display: inline-flex; align-items: center; gap: 8px; height: 54px; padding-inline: 18px 22px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.18); }

/* Tab bar */
.tabs { position: fixed; z-index: 8; left: 0; right: 0; bottom: 0; background: var(--bar); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))); }
.tabs-in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; }
.tab { position: relative; display: grid; justify-items: center; gap: 3px; padding-block: 6px; border-radius: 12px; color: var(--muted); font-size: .72rem; font-weight: 600; letter-spacing: .01em; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"] svg { transform: translateY(-1px); }
.badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding-inline: 5px; border-radius: 9px; background: var(--danger); color: var(--surface); font-size: .68rem; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums; }

/* Editor */
.ed-bar { position: sticky; top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 4px; padding-block: 10px; }
.ed-bar .spacer { flex: 1; }
.chip { --gc: var(--g-slate); display: inline-flex; align-items: center; gap: 8px; height: 34px; padding-inline: 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: .875rem; font-weight: 500; max-width: 46vw; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.none { color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in oklab, var(--accent) 10%, var(--surface)); }
.ed-title { width: 100%; border: 0; background: none; outline: none; font: 700 1.75rem/1.2 var(--f-display); letter-spacing: -.015em; padding-block: 8px 4px; }
.ed-title::placeholder, .ed-body::placeholder { color: var(--muted); opacity: .7; }
.ed-body { width: 100%; min-height: 50vh; border: 0; background: none; outline: none; resize: none; font-size: 1.05rem; line-height: 1.65; padding-block: 6px 20px; overflow: hidden; }
.ed-title:focus-visible, .ed-body:focus-visible { outline: none; }
.ed-meta { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); padding-block: 12px; }
.page-title { font: 700 1.6rem/1.2 var(--f-display); letter-spacing: -.015em; margin: 4px 0 14px; overflow-wrap: anywhere; }
.confirm { position: fixed; z-index: 12; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(16px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))); background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(0,0,0,.08); }
.confirm-in { max-width: 568px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.confirm p { margin: 0; font-weight: 500; }

/* Bottom sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; display: grid; align-items: end; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .2s ease; }
.sheet { position: relative; width: 100%; max-width: 600px; margin: 0 auto; max-height: 88vh; overflow: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px 20px calc(22px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))); transform: translateY(100%); transition: transform .24s cubic-bezier(.2,.8,.2,1); }
.sheet-wrap.open .scrim { opacity: 1; }
.sheet-wrap.open .sheet { transform: none; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 12px; }
#sheet-body { display: grid; gap: 16px; }
.sheet h2 { margin: 0; font: 650 1.3rem/1.2 var(--f-display); }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span, .field > label { font-size: .85rem; font-weight: 600; color: var(--muted); }
.input { height: 48px; width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding-inline: 14px; outline: none; }
.input.area { height: auto; min-height: 84px; padding-block: 12px; resize: vertical; line-height: 1.5; }
.input:focus { border-color: var(--accent); }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }

  const hostOf = u => { const n = normUrl(u); try { return n ? new URL(n).hostname.replace(/^www\./, '') : ''; } catch (e) { return ''; } };
  /* Accounts saved under the same name (or, with no name, the same website) group into one site. */
  const siteKey = d => (d.name || '').trim().toLowerCase() || hostOf(d.url);
  /* Each entry belongs to Personal or Work; older entries without one count as Personal. */
  const SPACES = { personal: { label: 'Personal', color: 'moss' }, work: { label: 'Work', color: 'tide' } };
  const spaceOf = d => (d && d.space === 'work') ? 'work' : 'personal';
  /* Work entries also belong to a company. The company list is kept encrypted in the vault ("pwmeta").
     A work entry with no company, or one whose company was removed, shows under the first company. */
  const DEFAULT_COMPANIES = [{ id: 'co-roco', name: 'Roco' }];
  let meta = { iv: null, companies: [] };
  const companies = () => meta.companies;
  const companyById = id => companies().find(c => c.id === id) || null;
  const companyOf = d => (d && spaceOf(d) === 'work') ? (companyById(d.company) || companies()[0] || null) : null;
  const groupKey = d => {
    const s = siteKey(d); if (!s) return '';

  };
  async function saveMeta() {
    if (!vaultKey || state.readOnly) return;

  }
  const countFor = coId => pwEntries().filter(e => e.p && e.p.data && spaceOf(e.p.data) === 'work' && (companyOf(e.p.data) || {}).id === coId).length;
  function pwGroups(entries) {
    const map = new Map();
    for (const e of entries) {
      const ok = e.p && e.p.data && !e.p.error;
      const k = ok ? (groupKey(e.p.data) || '!' + e.id) : '!' + e.id;
      if (!map.has(k)) map.set(k, { key: k, items: [] });
      map.get(k).items.push(e);

    for (const g of map.values()) g.items.sort((a, b) => ((a.p && a.p.data && a.p.data.user) || '').localeCompare((b.p && b.p.data && b.p.data.user) || '', 'en', { sensitivity: 'base' }));

  function siteInfo(g) {
    const ds = g.items.map(e => e.p && e.p.data).filter(Boolean);
    const name = (ds.find(d => (d.name || '').trim()) || {}).name || hostOf((ds.find(d => d.url) || {}).url) || 'Untitled';

  }

  /* ---------- reminders helpers ---------- */
  function dueMs(r) {
    if (!r.date) return null;
    const [y, m, d] = r.date.split('-').map(Number);
    if (r.time) { const [hh, mm] = r.time.split(':').map(Number); return new Date(y, m - 1, d, hh, mm).getTime(); }

  /* ---------- navigation ---------- */
  const TRASH_TAB = { note: 'notes', reminder: 'reminders', secret: 'passwords' };

  const ROOT = { today: { name: 'today' }, notes: { name: 'home' }, passwords: { name: 'pw' }, reminders: { name: 'rem' } };
  const fromHere = () => state.view.name === 'group' ? { name: 'group', id: state.view.id } : ['today', 'rem', 'trash'].includes(state.view.name) ? { name: state.view.name, ...(state.view.kind ? { kind: state.view.kind } : {}) } : { name: 'home' };

  function switchTab(t) { try { localStorage.setItem(TAB_KEY, t); } catch (e) {} go(ROOT[t]); }

  function createNote(group, asList) {

  /* ---------- rendering ---------- */

  function statusLine(kind) {

  /* ----- notes ----- */

  function buildHome() {
    app.dataset.view = 'home';
    app.innerHTML = `<header class="top">
        <div class="top-row"><h1>Notes</h1><span class="sub" id="home-count"></span></div>

  function renderHomeBody() {

  function buildGroup(gid) {

    const t = document.getElementById('note-title');

  /* ----- block editor ----- */
  let lastBlockId = null;
  function blockRow(b) {

      : b.type === 'li' ? '<span class="bullet" aria-hidden="true"></span>' : '';

  function renderBlocks(id, focusId, caret) {

  }
  function focusBlock(bid, caret) {

    lastBlockId = bid;
  }

    if (!h.flagged) return `<button class="health-card ok" type="button" data-action="pw-health"><span class="hc-icon">${ICON.shieldOk}</span><span class="hc-text"><span class="hc-title">No problems found</span><span class="hc-sub">No reused, weak or year-old passwords</span></span><span class="chev">${ICON.chev}</span></button>`;
    const parts = [];
    if (h.reusedCount) parts.push(`${h.reusedCount} reused`);
    if (h.weak.length) parts.push(`${h.weak.length} weak`);
    if (h.old.length) parts.push(`${h.old.length} over a year old`);
    return `<button class="health-card" type="button" data-action="pw-health"><span class="hc-icon">${ICON.shield}</span><span class="hc-text"><span class="hc-title">${plural(h.flagged, 'password')} ${h.flagged === 1 ? 'needs' : 'need'} attention</span><span class="hc-sub">${parts.join(' · ')}</span></span><span class="chev">${ICON.chev}</span></button>`;
  }
  function renderPwHealth() {
    app.dataset.view = 'pw-health';
    const h = healthReport();
    const since = t => new Date(t).toLocaleDateString('en-IE', { month: 'short', year: 'numeric' });
    let body = '';
    if (h.reused.length) {
      body += `<section class="section"><div class="section-head"><span class="label overdue">Reused</span><span class="sub">${h.reusedCount}</span></div>
        <p class="hint">If one of these sites leaks, every account sharing that password is exposed. Give each its own; open an entry and tap Generate.</p>
        ${h.reused.map(l => {
          const mixed = new Set(l.map(e => spaceOf(e.p.data))).size > 1;
          return `<div class="issue-group"><div class="issue-head"><strong>Same password on ${l.length} accounts</strong>${mixed ? '<span class="warn-text">Shared between personal and work</span>' : ''}</div><div class="list">${l.map(e => accountRow(e, true, true)).join('')}</div></div>`;
        }).join('')}</section>`;
    }
    if (h.weak.length) body += `<section class="section"><div class="section-head"><span class="label overdue">Weak</span><span class="sub">${h.weak.length}</span></div>
        <p class="hint">Short or simple passwords are easy to guess. Aim for 12 or more characters mixing letters, numbers and symbols.</p>
        <div class="list">${h.weak.map(e => accountRow(e, true, true)).join('')}</div></section>`;
    if (h.old.length) body += `<section class="section"><div class="section-head"><span class="label">Not changed in over a year</span><span class="sub">${h.old.length}</span></div>
        <p class="hint">Worth refreshing, starting with email and banking, since those can reset your other accounts.</p>
        <div class="list">${h.old.map(e => accountRow(e, true, true, 'Last changed ' + since(pwChangedAt(e)))).join('')}</div></section>`;
    if (!body) body = `<div class="calm" style="margin-top:18px">${ICON.shieldOk}<span><strong>All clear.</strong> No reused, weak or year-old passwords.</span></div>`;
    app.innerHTML = `<header class="top">
        <div class="top-row"><button class="back" type="button" data-action="pw-home">${ICON.back}<span>Passwords</span></button></div>
        <h1>Password health</h1>
        <span class="sub">Checks all ${plural(h.total, 'password')}, personal and work. The check runs on this device; nothing is sent anywhere.</span>
      </header>${body}`;
  }

  function accountRow(e, showSite, showSpace, subOverride) {
    if (!e.p || e.p.error) return brokenRow(e);
    const d = e.p.data, name = (d.name || '').trim() || hostOf(d.url) || 'Untitled';
    const title = showSite ? name : (d.user || 'No username');
    const sub = subOverride || (showSite ? (d.user || 'No username') : (d.note ? d.note.split('\n')[0] : 'Updated ' + ago((state.secrets[e.id] || {}).updated).toLowerCase()));
    return `<div class="pw-row">
      <button class="pw-main" type="button" data-action="pw-open" data-id="${esc(e.id)}">${avatarFor(showSite ? name : (d.user || name))}
        <span class="pw-text"><span class="pw-name">${esc(title)}${showSpace ? spaceTag(spaceOf(d), d) : ''}</span><span class="pw-user">${esc(sub)}</span></span></button>
      ${d.pass ? `<button class="icon-btn" type="button" data-action="pw-copy" data-id="${esc(e.id)}" aria-label="Copy password for ${esc(name)}${d.user ? ', ' + esc(d.user) : ''}">${ICON.copy}</button>` : ''}
    </div>`;
  }
  function siteRow(g) {
    if (g.items.length === 1) return accountRow(g.items[0], true);
    const info = siteInfo(g), n = g.items.length;
    const users = g.items.map(e => (e.p && e.p.data && e.p.data.user) || 'No username').join(', ');
    return `<div class="pw-row">
      <button class="pw-main" type="button" data-action="pw-site-open" data-key="${esc(g.key)}" aria-label="${esc(info.name)}, ${n} accounts">${avatarFor(info.name)}
        <span class="pw-text"><span class="pw-name">${esc(info.name)}</span><span class="pw-user">${esc(users)}</span></span></button>
      <span class="count-pill" aria-hidden="true">${n}</span><span class="chev" aria-hidden="true">${ICON.chev}</span>
    </div>`;
  }
  function renderPwBody() {
    const body = document.getElementById('pw-body'); if (!body) return;
    const entriesAll = pwEntries();
    const broken = entriesAll.filter(e => e.p && e.p.error);
    const everything = entriesAll.filter(e => e.p && e.p.data);
    const sp = state.pwSpace;
    const inSpace = e => spaceOf(e.p.data) === sp;
    for (const s of Object.keys(SPACES)) {
      const n = everything.filter(e => e.p && e.p.data && spaceOf(e.p.data) === s).length;
      const nEl = document.getElementById('pw-n-' + s); if (nEl) nEl.textContent = n ? n : '';
      const b = app.querySelector(`[data-action="pw-space"][data-space="${s}"]`); if (b) b.setAttribute('aria-pressed', s === sp ? 'true' : 'false');
    }
    const q = state.pwQuery.trim().toLowerCase();
    const cos = companies();
    if (state.pwCompany && !companyById(state.pwCompany)) state.pwCompany = '';
    const sel = sp === 'work' ? (cos.length > 1 ? state.pwCompany : ((cos[0] || {}).id || '')) : '';
    const selCo = sel ? companyById(sel) : null;

    /* company chips (Work only) */
    const cbar = document.getElementById('pw-cbar');
    if (cbar) {
      cbar.hidden = sp !== 'work' || !!q;
      if (sp === 'work') {
        const workTotal = everything.filter(e => e.p && e.p.data && spaceOf(e.p.data) === 'work').length;
        const chip = (id, name, n) => `<button class="chip" type="button" data-action="pw-company" data-id="${esc(id)}" aria-pressed="${sel === id ? 'true' : 'false'}"><span>${esc(name)}</span><span class="n">${n}</span></button>`;
        cbar.innerHTML = `<div class="chips" role="group" aria-label="Company">${cos.length > 1 ? chip('', 'All', workTotal) : ''}${cos.map(c => chip(c.id, c.name, countFor(c.id))).join('')}${state.readOnly ? '' : `<button class="chip add" type="button" data-action="pw-companies">${cos.length ? 'Edit companies' : 'Add a company'}</button>`}</div>`;
      }
    }

    const inCompany = e => !selCo || !(e.p && e.p.data) || (companyOf(e.p.data) || {}).id === sel;
    const all = everything.filter(inSpace).filter(inCompany);
    const groups = pwGroups(all);
    const label = SPACES[sp].label.toLowerCase();
    const where = selCo && cos.length > 1 ? ' at ' + selCo.name : '';
    document.getElementById('pw-count').textContent = q ? '' : !all.length ? '' : (groups.length === all.length ? plural(all.length, label + ' password') : `${plural(all.length, label + ' password')} for ${plural(groups.length, 'site')}`) + where;
    if (!everything.length || (!all.length && !q)) {
      const first = !everything.length;
      const what = selCo && cos.length > 1 ? `passwords for ${selCo.name}` : `${label} passwords`;
      body.innerHTML = `<div class="empty-card"><h2>${first ? 'No passwords saved yet' : `No ${esc(what)} yet`}</h2>
        <p>${first ? 'Add the logins you use most and mark each one Personal or Work. Several accounts for the same site, like two email addresses, are kept together under that site.' : `Add one here, or open an existing password and switch it to ${SPACES[sp].label}${selCo && cos.length > 1 ? ' at ' + esc(selCo.name) : ''}.`}</p>
        ${state.readOnly ? '' : `<button class="btn primary" type="button" data-action="pw-new">${ICON.plus}Add ${first ? 'password' : label + ' password'}</button>`}</div>${brokenSection(broken)}${statusLine('pw')}<div id="ed-confirm"></div>`;
      return;
    }
    const byName = (a, b) => siteInfo(a).name.localeCompare(siteInfo(b).name, 'en', { sensitivity: 'base' });
    let html;
    if (q) {
      const hits = everything.filter(e => e.p && e.p.data && [e.p.data.name, e.p.data.user, e.p.data.url, (companyOf(e.p.data) || {}).name].join(' ').toLowerCase().includes(q));
      html = `<section class="section">${hits.length ? `<div class="list">${hits.map(e => accountRow(e, true, true)).join('')}</div>` : `<p class="sub">Nothing matches “${esc(state.pwQuery.trim())}”.</p>`}</section>`;
    } else if (sp === 'work' && !selCo && cos.length > 1) {
      /* All companies: one section per company */
      html = cos.map(c => {
        const gs = groups.filter(g => g.items[0].p && g.items[0].p.data && (companyOf(g.items[0].p.data) || {}).id === c.id).sort(byName);
        if (!gs.length) return '';
        const n = gs.reduce((t, g) => t + g.items.length, 0);
        return `<section class="section"><div class="section-head"><span class="label">${esc(c.name)}</span><span class="sub">${plural(n, 'password')}</span></div><div class="list">${gs.map(siteRow).join('')}</div></section>`;
      }).join('');
      const broken = groups.filter(g => !(g.items[0].p && g.items[0].p.data));
      if (broken.length) html += `<section class="section"><div class="list">${broken.map(siteRow).join('')}</div></section>`;
    } else {
      html = `<section class="section"><div class="list">${groups.sort(byName).map(siteRow).join('')}</div></section>`;
    }
    body.innerHTML = (q ? '' : healthCard()) + html + (q ? '' : brokenSection(broken)) + statusLine('pw') + '<div id="ed-confirm"></div>';
  }

  function openCompaniesSheet() {
    if (state.readOnly || !vaultKey) return;
    const refresh = () => { if (state.view.name === 'pw') renderPwBody(); };
    openSheet(`<h2 id="sheet-title">Companies</h2>
      <p class="hint">Work passwords are sorted by company. To rename one, edit its name.</p>
      <div class="co-list" id="co-list"></div>
      <div class="field"><label for="co-new">Add a company</label>
        <div class="inline"><input class="input" id="co-new" maxlength="60" placeholder="Company name" autocomplete="off"><button class="btn primary" type="button" id="co-add">Add</button></div>
        <p class="err" id="co-err" hidden></p></div>
      <div class="sheet-actions"><span></span><button class="btn" type="button" data-close>Done</button></div>`, () => {
      const list = document.getElementById('co-list'), err = document.getElementById('co-err');
      const draw = () => {
        const cos = companies();
        list.innerHTML = cos.map(c => {
          const n = countFor(c.id), canDel = n === 0 && cos.length > 1;
          const why = canDel ? 'Remove ' + c.name : n ? 'Move its passwords to another company first' : 'Keep at least one company';
          return `<div class="co-row"><input class="input" data-co="${esc(c.id)}" maxlength="60" aria-label="Name for ${esc(c.name)}"><span class="sub">${plural(n, 'password')}</span>
            <button class="icon-btn" type="button" data-co-del="${esc(c.id)}" ${canDel ? '' : 'disabled'} aria-label="${esc(why)}" title="${esc(why)}">${ICON.trash}</button></div>`;
        }).join('');
        list.querySelectorAll('[data-co]').forEach(i => { i.value = (companyById(i.dataset.co) || {}).name || ''; });
      };
      draw();
      const add = () => {
        const name = document.getElementById('co-new').value.trim(); if (!name) return;
        if (companies().some(c => c.name.toLowerCase() === name.toLowerCase())) { err.textContent = `${name} is already on the list.`; err.hidden = false; return; }
        err.hidden = true;
        meta.companies.push({ id: newId('co'), name });
        saveMeta(); document.getElementById('co-new').value = ''; draw(); refresh(); toast(`Added ${name}`);
      };
      document.getElementById('co-add').addEventListener('click', add);
      document.getElementById('co-new').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
      list.addEventListener('change', e => {
        const id = e.target.dataset.co; if (!id) return;
        const c = companyById(id), name = e.target.value.trim();
        if (!c) return;
        if (!name) { e.target.value = c.name; return; }
        if (name !== c.name) { c.name = name; saveMeta(); refresh(); toast('Company renamed'); }
      });
      list.addEventListener('click', e => {
        const b = e.target.closest('[data-co-del]'); if (!b || b.disabled) return;
        const id = b.dataset.coDel, c = companyById(id);
        meta.companies = meta.companies.filter(x => x.id !== id);
        if (state.pwCompany === id) state.pwCompany = '';
        saveMeta(); draw(); refresh(); toast(`Removed ${c ? c.name : 'company'}`);
      });
    });
  }
  function renderPwSite(key) {
    const g = findSite(key);
    if (!g) { go({ name: 'pw' }); return; }
    app.dataset.view = 'pw-site:' + key;
    const info = siteInfo(g), url = normUrl(info.url);
    app.innerHTML = `<header class="top">
        <div class="top-row"><button class="back" type="button" data-action="pw-home">${ICON.back}<span>Passwords</span></button></div>
        <div class="site-title">${avatarFor(info.name)}<h1>${esc(info.name)}</h1></div>
        <span class="sub">${SPACES[spaceOf(g.items[0].p && g.items[0].p.data)].label}${(co => co ? ' · ' + esc(co.name) : '')(companyOf(g.items[0].p && g.items[0].p.data))} · ${plural(g.items.length, 'account')}${url ? ` · <a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(hostOf(url))}</a>` : ''}</span>
      </header>
      <div class="list">${g.items.map(e => accountRow(e, false)).join('')}</div>
      ${state.readOnly ? '' : `<div class="after-list"><button class="btn" type="button" data-action="pw-add-account">${ICON.plus}Add another account</button></div>`}
      ${statusLine('pw')}`;
  }

  let pwDirty = false;
  function buildPwEntry(v) {
    app.dataset.view = 'pw-entry:' + v.id;
    pwDirty = false;
    const d = v.isNew ? (v.prefill || {}) : ((plain[v.id] && plain[v.id].data) || {});
    const url = v.isNew ? '' : normUrl(d.url);
    const fromSite = v.from && v.from.name === 'pw-site' ? findSite(v.from.key) : null;
    const backLabel = fromSite ? siteInfo(fromSite).name : (v.from && v.from.name === 'pw-health') ? 'Password health' : 'Passwords';
    const title = v.isNew ? (v.prefill && v.prefill.name ? 'New account for ' + v.prefill.name : 'New password') : (d.name || hostOf(d.url) || 'Untitled');
    const siteNames = [...new Set(pwEntries().map(e => e.p && e.p.data && (e.p.data.name || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    app.innerHTML = `<div class="ed-bar">
        <button class="back" type="button" data-action="pw-back">${ICON.back}<span>${esc(backLabel)}</span></button>
        <span class="spacer"></span>
        ${!v.isNew && !state.readOnly ? `<button class="icon-btn" type="button" data-action="pw-ask-delete" aria-label="Delete password">${ICON.trash}</button>` : ''}
      </div>
      <h2 class="page-title" id="pw-title">${esc(title)}</h2>
      <form class="form" id="pw-form" autocomplete="off">
        <fieldset class="seg" aria-label="Personal or work">${Object.keys(SPACES).map(s => `<label><input type="radio" name="pw-space" id="pw-space-${s}" value="${s}"><span style="--gc:var(--g-${SPACES[s].color})"><i></i>${SPACES[s].label}</span></label>`).join('')}</fieldset>
        <div class="field" id="pw-co-field" hidden><label for="pw-company">Company</label>
          <select class="input" id="pw-company"></select>
          <div class="inline" id="pw-newco-row" hidden><input class="input" id="pw-newco" maxlength="60" placeholder="New company name" autocomplete="off"><button class="btn" type="button" id="pw-newco-add">Add</button></div></div>
        <div class="field"><label for="pw-name">Name</label><input class="input" id="pw-name" maxlength="120" list="pw-site-names" placeholder="e.g. Gmail, Bank of Ireland">
          <datalist id="pw-site-names">${siteNames.map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist>
          <p class="hint" id="pw-siblings" hidden></p></div>
        <div class="field"><label for="pw-user">Username or email</label>
          <div class="inline"><input class="input" id="pw-user" maxlength="200" autocapitalize="off" spellcheck="false"><button class="icon-btn" type="button" data-copy="pw-user" aria-label="Copy username">${ICON.copy}</button></div></div>
        <div class="field"><label for="pw-pass">Password</label>
          <div class="inline"><input class="input mono" id="pw-pass" type="password" maxlength="500" autocomplete="new-password" autocapitalize="off" spellcheck="false">
            <button class="icon-btn" type="button" id="pw-show" aria-label="Show password" aria-pressed="false">${ICON.eye}</button>
            <button class="icon-btn" type="button" data-copy="pw-pass" aria-label="Copy password">${ICON.copy}</button></div>
          <div class="field-foot">${state.readOnly ? '' : '<button class="text-btn" type="button" id="pw-gen">Generate a strong password</button>'}<span class="strength" id="pw-strength"></span></div>
          <p class="warn-text" id="pw-reuse" hidden></p>
          ${!v.isNew && d.pass ? `<p class="hint">Password last changed ${esc(new Date(d.pwChanged || (state.secrets[v.id] || {}).created || Date.now()).toLocaleDateString('en-IE', { day: 'numeric', month: 'short', year: 'numeric' }))}</p>` : ''}</div>
        <div class="field"><label for="pw-url">Website</label><input class="input" id="pw-url" inputmode="url" maxlength="300" autocapitalize="off" spellcheck="false" placeholder="e.g. bankofireland.com">
          ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="hint">Open ${esc(new URL(url).hostname)}</a>` : ''}</div>
        <div class="field"><label for="pw-note">Notes</label><textarea class="input area" id="pw-note" maxlength="2000" placeholder="Security questions, PIN hints, account numbers…"></textarea></div>
        <p class="err" id="pw-err" hidden></p>
        ${state.readOnly ? '' : `<div class="btn-row"><button class="btn primary" type="submit" id="pw-save">${v.isNew ? 'Save password' : 'Save changes'}</button>
          ${v.isNew ? '' : `<button class="btn" type="button" data-action="pw-add-sibling">${ICON.plus}Another account for this site</button>`}</div>`}
      </form>
      <div id="ed-confirm"></div>`;
    const f = id => document.getElementById(id);
    f('pw-name').value = d.name || ''; f('pw-user').value = d.user || ''; f('pw-pass').value = d.pass || ''; f('pw-url').value = d.url || ''; f('pw-note').value = d.note || '';
    ['pw-name', 'pw-user', 'pw-pass', 'pw-url', 'pw-note'].forEach(i => { f(i).readOnly = state.readOnly; });
    const space0 = v.isNew ? ((v.prefill && v.prefill.space) || state.pwSpace) : spaceOf(d);
    f('pw-space-' + space0).checked = true;
    Object.keys(SPACES).forEach(s => { f('pw-space-' + s).disabled = state.readOnly; });
    const curSpace = () => (app.querySelector('input[name="pw-space"]:checked') || {}).value || 'personal';
    /* company picker */
    const fillCompanies = selId => {
      const opts = companies().map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
      f('pw-company').innerHTML = opts + (state.readOnly ? '' : '<option value="__new">New company…</option>');
      if (selId && companyById(selId)) f('pw-company').value = selId;
      else if (companies()[0]) f('pw-company').value = companies()[0].id;
    };
    const co0 = v.isNew ? ((v.prefill && v.prefill.company) || (state.pwSpace === 'work' && state.pwCompany) || '') : ((companyOf({ ...d, space: 'work' }) || {}).id || '');
    fillCompanies(co0);
    f('pw-company').disabled = state.readOnly;
    const showCoField = () => { f('pw-co-field').hidden = curSpace() !== 'work'; };
    showCoField();
    let lastCo = f('pw-company').value;
    f('pw-company').addEventListener('change', () => {
      if (f('pw-company').value === '__new') { f('pw-newco-row').hidden = false; f('pw-newco').focus(); }
      else { f('pw-newco-row').hidden = true; lastCo = f('pw-company').value; }
    });
    const addNewCo = () => {
      const name = f('pw-newco').value.trim(); if (!name) return;
      let c = companies().find(x => x.name.toLowerCase() === name.toLowerCase());
      if (!c) { c = { id: newId('co'), name }; meta.companies.push(c); saveMeta(); toast(`Added ${name}`); }
      fillCompanies(c.id); lastCo = c.id;
      f('pw-newco').value = ''; f('pw-newco-row').hidden = true; pwDirty = true; showSiblings();
    };
    f('pw-newco-add').addEventListener('click', addNewCo);
    f('pw-newco').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); addNewCo(); }
      if (e.key === 'Escape') { e.stopPropagation(); f('pw-newco-row').hidden = true; f('pw-company').value = lastCo; }
    });
    const curCompany = () => { const val = f('pw-company').value; return val && val !== '__new' ? val : lastCo; };
    const showStrength = () => {
      const pv = f('pw-pass').value, s = strength(pv), el = f('pw-strength');
      el.className = 'strength' + (s ? ' ' + s[0] : ''); el.textContent = s ? s[1] : '';
      const same = pv ? pwEntries().filter(e => e.id !== v.id && e.p && e.p.data && e.p.data.pass === pv) : [];
      const r = f('pw-reuse'); r.hidden = !same.length;
      if (same.length) {
        const names = same.slice(0, 3).map(e => ((e.p.data.name || hostOf(e.p.data.url) || 'Untitled') + (spaceOf(e.p.data) === 'work' ? ' (work)' : ''))).join(', ');
        r.textContent = `Also used for ${names}${same.length > 3 ? ` and ${same.length - 3} more` : ''}. A different password for each account is safer.`;
      }
    };
    const showSiblings = () => {
      const space = curSpace();
      const k = groupKey({ name: f('pw-name').value, url: f('pw-url').value, space, company: curCompany() });
      const others = k ? pwEntries().filter(e => e.id !== v.id && e.p && e.p.data && groupKey(e.p.data) === k).length : 0;
      const el = f('pw-siblings');
      el.hidden = !others;
      const kind = space === 'work' ? ((companyById(curCompany()) || {}).name || 'work') : 'personal';
      el.textContent = others ? `Kept together with ${plural(others, 'other ' + kind + ' account')} for this site.` : '';
    };
    showStrength(); showSiblings();
    const onFormChange = e => {
      if (e.target.id === 'pw-newco') return;
      pwDirty = true;
      if (e.target.id === 'pw-pass') showStrength();
      if (e.target.name === 'pw-space') showCoField();
      if (['pw-name', 'pw-url', 'pw-company'].includes(e.target.id) || e.target.name === 'pw-space') showSiblings();
    };

  async function changeMaster(oldPw, newPw) {
    const v = state.vault;

    try { await unseal(oldKey, v.check); } catch (e) { throw { wrongPw: true }; }
    /* decrypt and re-encrypt everything in memory first; only write once all of it succeeded */

    if (state.pwMetaBox) { try { metaData = await unseal(oldKey, state.pwMetaBox); } catch (e) { /* use current list */ } }

    const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
    const newKey = await deriveKey(newPw, salt, KDF_ITER);
    const check = await seal(newKey, { ok: 'stacks-vault' });
    const sealed = [];
    for (const it of items) sealed.push({ ...it, box: await seal(newKey, it.data) });
    const metaBox = await seal(newKey, metaData);
    const vdoc = { kind: 'vault', v: 1, salt, iter: KDF_ITER, check, created: v.created || Date.now(), changed: Date.now() };
    for (const x of sealed) put(x.s.id, { kind: 'secret', iv: x.box.iv, ct: x.box.ct, created: x.s.created, updated: x.s.updated });
    put('pwmeta', { kind: 'pwmeta', iv: metaBox.iv, ct: metaBox.ct });
    put('vault', vdoc);
    state.vault = vdoc; vaultKey = newKey; lastActive = Date.now();
    for (const x of sealed) { state.secrets[x.s.id] = { ...state.secrets[x.s.id], iv: x.box.iv, ct: x.box.ct }; plain[x.s.id] = { iv: x.box.iv, data: x.data }; }
    meta = { iv: metaBox.iv, companies: Array.isArray(metaData.companies) ? metaData.companies : [] };
    state.pwMetaBox = raw.pwmeta;
  }

  function mergeCompanies(list) {

  async function doRestore(b, opts, backupPw) {

    if (opts.pw && (b.secrets || []).length && b.vault) {
      if (!state.vault) {
        /* no vault here yet: bring the backup's vault over as it is; unlock with the backup's password */
        put('vault', b.vault); if (b.pwmeta) put('pwmeta', b.pwmeta);
        for (const s of b.secrets) { put(s.id, strip(s)); n++; }
      } else if (b.vault.salt === state.vault.salt) {

      } else {

        if (bm) mergeCompanies(bm.companies);

  let notifTimer = null, lastNotifSig = null;

  function onNotifAction(actionId, extra) {

  const cmpVer = (a, b) => { const x = a.split('.').map(Number), y = b.split('.').map(Number); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; } return 0; };
  async function checkForUpdate(manual) {
    if (!NATIVE) return;
    try {
      const r = await fetch(`https://api.github.com/repos/${APP_REPO}/releases/latest`, { headers: { Accept: 'application/vnd.github+json' } });
      if (!r.ok) throw 0;
      const j = await r.json(), latest = String(j.tag_name || '').replace(/^v/, '');
      try { localStorage.setItem('stacks-update-checked', String(Date.now())); } catch (e) {}
      const asset = (j.assets || []).find(a => /\.apk$/.test(a.name));
      if (latest && cmpVer(latest, NATIVE.version) > 0) {
        state.update = { version: latest, url: asset ? asset.browser_download_url : `https://github.com/${APP_REPO}/releases/latest/download/stacks.apk` };
        try { localStorage.setItem('stacks-update', JSON.stringify(state.update)); } catch (e) {}
        if (manual) { switchTab('today'); toast('Version ' + latest + ' is available'); } else if (state.view.name === 'today') render();
      } else { state.update = null; if (manual) toast('You have the latest version (' + NATIVE.version + ')'); }
    } catch (e) { if (manual) toast('Couldn\u2019t check for updates. Check your internet connection.'); }
  }
  function onAndroidBack() {

    const m = document.getElementById('mention'); if (m && !m.hidden) { hideMention(); return; }
    const c = document.getElementById('ed-confirm'); if (c && c.innerHTML.trim()) { c.innerHTML = ''; return; }
    const back = app.querySelector('.back'); if (back) { back.click(); return; }

  }
  function nativeReady() {

  /* ----- reminders ----- */
  /* Repeats. A ticked repeating reminder moves to its next date instead of being marked done. */
  const REPEATS = { '': 'Never', daily: 'Every day', weekdays: 'Weekdays', weekly: 'Every week', monthly: 'Every month', yearly: 'Every year' };
  function advance(dateStr, rep, rday) {
    const [y, m, d] = dateStr.split('-').map(Number);
    let dt = new Date(y, m - 1, d);

  }
  function remRow(r, opts) {
    const preview = !!(opts && opts.preview);
    const b = bucket(r), label = dueLabel(r);
    const rep = r.repeat && REPEATS[r.repeat] ? r.repeat : '';
    const snoozable = !preview && !r.done && (b === 'overdue' || b === 'today') && !state.readOnly;
    return `<div class="rem ${b}">
      ${preview ? `<span class="tick tick-ghost" aria-hidden="true">${ICON.repeat}</span>` : `<button class="tick" type="button" data-action="rem-toggle" data-id="${esc(r.id)}" aria-pressed="${r.done ? 'true' : 'false'}" aria-label="${r.done ? 'Mark not done' : 'Mark done'}: ${esc(r.title)}"><span>${ICON.tick}</span></button>`}
      <button class="rem-main" type="button" data-action="rem-open" data-id="${esc(r.id)}">
        <span class="rem-title">${esc(r.title)}</span>
        ${label || rep ? `<span class="rem-due">${label ? ICON.clock + esc(b === 'overdue' ? 'Overdue · ' + label : label) : ''}${rep ? `<span class="rep">${ICON.repeat}${esc(REPEATS[rep])}</span>` : ''}</span>` : ''}
        ${r.note ? `<span class="rem-note">${esc(r.note)}</span>` : ''}
        ${r.noteId && state.notes[r.noteId] ? `<span class="rem-from">${ICON.note.replace('width="20" height="20"', 'width="13" height="13"')}${esc(noteName(state.notes[r.noteId]))}</span>` : ''}
      </button>
      ${snoozable ? `<button class="icon-btn rem-act" type="button" data-action="rem-snooze" data-id="${esc(r.id)}" aria-label="Snooze ${esc(r.title)}">${ICON.snooze}</button>` : ''}

  }
  function completeReminder(id) {

    }

    saveReminder(r); render(); if (r.done) toast('Done: ' + r.title);
  }
  function openSnoozeSheet(id) {
    const r = state.reminders[id]; if (!r || state.readOnly) return;

    const inHour = new Date(now.getTime() + 60 * 60000); inHour.setMinutes(Math.ceil(inHour.getMinutes() / 5) * 5, 0, 0);
    const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());

  function renderReminders() {

  /* ----- calendar ----- */
  function occurrencesIn(r, from, to) {

  function renderCalendar() {

  /* ----- today ----- */
